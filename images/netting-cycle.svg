<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b98a9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="490" rx="16" fill="#ffffff" stroke="#e3e8ef"/>

  <!-- obligations -->
  <rect x="55" y="180" width="215" height="100" rx="12" fill="#eef3fb" stroke="#c9d7ec"/>
  <text x="162" y="219" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1e3a5f">Obligations</text>
  <text x="162" y="241" text-anchor="middle" font-size="12.5" fill="#4a6785">settlement legs opted</text>
  <text x="162" y="259" text-anchor="middle" font-size="12.5" fill="#4a6785">into the cycle</text>

  <!-- cycle engine -->
  <rect x="350" y="180" width="220" height="100" rx="12" fill="#2c5282"/>
  <text x="460" y="214" text-anchor="middle" font-size="15.5" font-weight="600" fill="#ffffff">Cycle engine</text>
  <text x="460" y="236" text-anchor="middle" font-size="12.5" fill="#c5d8f0">nets multilaterally</text>
  <text x="460" y="254" text-anchor="middle" font-size="12.5" fill="#c5d8f0">per asset &amp; corridor</text>

  <!-- matched -->
  <rect x="680" y="55" width="275" height="115" rx="12" fill="#e6f4ec" stroke="#9fcbb4"/>
  <text x="817" y="92" text-anchor="middle" font-size="15.5" font-weight="600" fill="#14532d">Matched flow</text>
  <text x="817" y="114" text-anchor="middle" font-size="12.5" fill="#2f6a4a">cancels on the ledger at</text>
  <text x="817" y="132" text-anchor="middle" font-size="12.5" fill="#2f6a4a">bookkeeping cost</text>
  <text x="817" y="152" text-anchor="middle" font-size="12" font-style="italic" fill="#4b8367">no bridge · no rebalance</text>

  <!-- residual -->
  <rect x="680" y="290" width="275" height="115" rx="12" fill="#fdf1e5" stroke="#e9caa4"/>
  <text x="817" y="327" text-anchor="middle" font-size="15.5" font-weight="600" fill="#7c4a12">Residual</text>
  <text x="817" y="349" text-anchor="middle" font-size="12.5" fill="#8a5a22">whatever did not match takes</text>
  <text x="817" y="367" text-anchor="middle" font-size="12.5" fill="#8a5a22">the first priced exit</text>
  <text x="817" y="387" text-anchor="middle" font-size="12" font-style="italic" fill="#a06c30">never left waiting</text>

  <!-- net settlement -->
  <rect x="1000" y="180" width="150" height="100" rx="12" fill="#2c5282"/>
  <text x="1075" y="219" text-anchor="middle" font-size="15.5" font-weight="600" fill="#ffffff">Net</text>
  <text x="1075" y="240" text-anchor="middle" font-size="15.5" font-weight="600" fill="#ffffff">settlement</text>
  <text x="1075" y="261" text-anchor="middle" font-size="12.5" fill="#c5d8f0">reaches the rails</text>

  <!-- arrows -->
  <path d="M270,230 H342" stroke="#8b98a9" stroke-width="1.6" fill="none" marker-end="url(#arrow2)"/>
  <path d="M570,210 H615 V112 H672" stroke="#8b98a9" stroke-width="1.6" fill="none" marker-end="url(#arrow2)"/>
  <path d="M570,250 H615 V347 H672" stroke="#8b98a9" stroke-width="1.6" fill="none" marker-end="url(#arrow2)"/>
  <path d="M955,112 H978 V210 H992" stroke="#8b98a9" stroke-width="1.6" fill="none" marker-end="url(#arrow2)"/>
  <path d="M955,347 H978 V250 H992" stroke="#8b98a9" stroke-width="1.6" fill="none" marker-end="url(#arrow2)"/>

  <!-- waterfall caption -->
  <text x="817" y="435" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">Backstop waterfall</text>
  <text x="817" y="456" text-anchor="middle" font-size="12.5" fill="#64748b">vault liquidity · wholesale desk · discount auction · external rebalance</text>
</svg>
