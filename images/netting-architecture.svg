<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b98a9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="680" rx="16" fill="#ffffff" stroke="#e3e8ef"/>

  <!-- domain separators -->
  <line x1="420" y1="56" x2="420" y2="600" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 7"/>
  <line x1="790" y1="56" x2="790" y2="600" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7 7"/>

  <!-- ============ ORIGIN DOMAIN ============ -->
  <rect x="100" y="96" width="220" height="64" rx="32" fill="#e8eefb" stroke="#c3d0ea"/>
  <text x="210" y="122" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1e3a5f">Participants</text>
  <text x="210" y="142" text-anchor="middle" font-size="12.5" fill="#4a6785">users · market makers · desks</text>

  <rect x="100" y="214" width="220" height="76" rx="12" fill="#eef3fb" stroke="#c9d7ec"/>
  <text x="210" y="245" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1e3a5f">Executed trade</text>
  <text x="210" y="266" text-anchor="middle" font-size="12.5" fill="#4a6785">a settlement leg falls due</text>

  <rect x="100" y="364" width="220" height="76" rx="12" fill="#2c5282"/>
  <text x="210" y="395" text-anchor="middle" font-size="15.5" font-weight="600" fill="#ffffff">Spoke</text>
  <text x="210" y="416" text-anchor="middle" font-size="12.5" fill="#c5d8f0">settlement endpoint</text>

  <path d="M210,160 V206" stroke="#8b98a9" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M210,290 V356" stroke="#8b98a9" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="224" y="327" font-size="12.5" fill="#64748b">opt into clearing</text>

  <!-- ============ CLEARING HUB ============ -->
  <rect x="495" y="110" width="220" height="76" rx="12" fill="#2c5282"/>
  <text x="605" y="141" text-anchor="middle" font-size="15.5" font-weight="600" fill="#ffffff">Clearing ledger</text>
  <text x="605" y="162" text-anchor="middle" font-size="12.5" fill="#c5d8f0">obligations &amp; net balances</text>

  <rect x="495" y="262" width="220" height="76" rx="12" fill="#2c5282"/>
  <text x="605" y="293" text-anchor="middle" font-size="15.5" font-weight="600" fill="#ffffff">Cycle engine</text>
  <text x="605" y="314" text-anchor="middle" font-size="12.5" fill="#c5d8f0">nets multilaterally</text>

  <rect x="495" y="414" width="220" height="76" rx="12" fill="#1e3a8a"/>
  <text x="605" y="445" text-anchor="middle" font-size="15.5" font-weight="600" fill="#ffffff">Backstop layer</text>
  <text x="605" y="466" text-anchor="middle" font-size="12.5" fill="#c5d8f0">priced exits for the residual</text>

  <path d="M605,186 V254" stroke="#8b98a9" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M605,338 V406" stroke="#8b98a9" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="619" y="376" font-size="12.5" fill="#64748b">residual</text>

  <!-- ============ SETTLEMENT DOMAIN ============ -->
  <rect x="885" y="262" width="220" height="76" rx="12" fill="#2c5282"/>
  <text x="995" y="293" text-anchor="middle" font-size="15.5" font-weight="600" fill="#ffffff">Spoke</text>
  <text x="995" y="314" text-anchor="middle" font-size="12.5" fill="#c5d8f0">any domain you configure</text>

  <rect x="885" y="500" width="220" height="64" rx="32" fill="#e8eefb" stroke="#c3d0ea"/>
  <text x="995" y="526" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1e3a5f">Participant</text>
  <text x="995" y="546" text-anchor="middle" font-size="12.5" fill="#4a6785">receives one net figure</text>

  <path d="M995,338 V492" stroke="#8b98a9" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ CROSS-DOMAIN ============ -->
  <path d="M320,402 H452 V148 H487" stroke="#8b98a9" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="386" y="392" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">obligation</text>
  <text x="386" y="420" text-anchor="middle" font-size="12.5" fill="#64748b">via messaging layer</text>

  <path d="M715,300 H877" stroke="#8b98a9" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="796" y="288" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">net settlement</text>
  <text x="796" y="320" text-anchor="middle" font-size="12.5" fill="#64748b">via messaging layer</text>

  <path d="M715,452 H945 V354" stroke="#8b98a9" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <text x="830" y="442" text-anchor="middle" font-size="12.5" fill="#64748b">priced residual</text>

  <!-- ============ DOMAIN LABELS ============ -->
  <text x="210" y="634" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">Origin domain</text>
  <text x="605" y="634" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">Clearing hub</text>
  <text x="995" y="634" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">Settlement domain</text>
</svg>
